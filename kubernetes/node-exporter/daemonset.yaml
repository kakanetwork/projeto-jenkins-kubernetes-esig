apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter
  labels:
    app: node-exporter

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostPID: true
      hostNetwork: true
      automountServiceAccountToken: false

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.12.1
          imagePullPolicy: IfNotPresent

          args:
            - --path.rootfs=/host

          ports:
            - name: metrics
              containerPort: 9100

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true

      volumes:
        - name: host-root
          hostPath:
            path: /